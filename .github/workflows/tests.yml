name: Tests

on:
  push:
  pull_request:

jobs:
  web-scraper-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r web_scraper/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s web_scraper/tests
